  action: "Baza została utworzona pod nową nazwą — sprawdź ją przed przełączeniem aplikacji; spróbuj starszej kopii."
  action.en: "The database was created under a new name - check it before switching the application over; try an older backup."
  source: "D5.11, D8.4, AC-32.1"
  since: "0.1"

- code: KB-7007
  name: SecondInstance
  class: permanent
  severity: error
  message.pl: "Usługa Kobian już działa na tym komputerze — druga instancja została zatrzymana bez zmian w katalogu."
  message.en: "The Kobian service is already running on this computer — the second instance stopped without changing the catalog."
  action: "Nie uruchamiaj Agenta ręcznie, gdy działa usługa KobianAgent; sprawdź stan usługi w Menedżerze usług."
  action.en: "Do not start the Agent manually while the KobianAgent service is running; check the service state in Services."
  source: "D2.15, AC-37.3, CE-12"
  since: "0.1"

- code: KB-2101
  name: SmbCredentialConflict
  class: permanent
  severity: error
  message.pl: "Do serwera SMB jest już połączenie z innym kontem (błąd 1219)."
  message.en: "The SMB server already has a connection under a different account (error 1219)."
  action: "Zgłoś błąd - zadania z różnymi kontami do jednego serwera powinny być kolejkowane."
  action.en: "Report the bug - jobs with different accounts to one server should be queued."
  source: "D4.8, D7.4, BL-73"
  since: "0.1"

- code: KB-2103
  name: AccountLockedOrExpired
  class: permanent
  severity: error
  message.pl: "Konto na serwerze jest zablokowane, wygasło albo wymaga zmiany hasła."
  message.en: "The account on the server is locked, expired or must change its password."
  action: "Odblokuj konto lub zmień hasło na serwerze, potem zaktualizuj poświadczenie celu."
  action.en: "Unlock the account or change the password on the server, then update the destination credential."
  source: "D4.8, BL-73"
  since: "0.1"

- code: KB-7001
  name: CallerUnauthenticated
  class: security
  severity: error
  message.pl: "Nie można ustalić tożsamości wywołującego — połączenie z usługą odrzucone."
  message.en: "Caller identity could not be established — connection to the service rejected."
  action: "Uruchom Kobian lokalnie na koncie z grupy Kobian Operators lub Administratorzy (nie przez sieć ani konto anonimowe)."
  action.en: "Run Kobian locally under an account in the Kobian Operators or Administrators group (not over the network or as an anonymous account)."
  source: "D2.9, BL-17 (budowa it. 95)"
  since: "0.1"

- code: KB-2114
  name: DestinationOpenThrottled
  class: transient
  severity: warning
  message.pl: "Wstrzymano na 10 min próby połączenia z celem po 3 nieudanych w ciągu godziny (ochrona konta i adresu przed blokadą)."
  message.en: "Connection attempts to the destination are paused for 10 minutes after 3 failures within an hour (protects the account and address from lockout)."
  action: "Sprawdź poświadczenia i dostępność serwera; kolejna próba nastąpi automatycznie po przerwie."
  action.en: "Check the credentials and the server availability; the next attempt will follow automatically after a pause."
  source: "D4.16 pkt 3, SEC-24.4, BL-77 (budowa it. 97)"
  since: "0.1"

- code: KB-5106
  name: RestoreTargetSpace
  class: permanent
  severity: error
  message.pl: "Za mało wolnego miejsca w folderze docelowym na odtwarzane pliki."
  message.en: "Not enough free space in the destination folder for the files to restore."
  action: "Zwolnij miejsce albo wybierz inny folder lub mniejszy zakres."
  action.en: "Free up space or choose another folder or a smaller scope."
  source: "SCR-07, R2.8.1 (budowa it. 98)"
  since: "0.1"

- code: KB-6502
  name: AuditSchemaChanged
  class: security
  severity: critical
  message.pl: "Schemat dziennika audytu został zmieniony poza programem."
  message.en: "The audit log schema was changed outside the program."
  action: "Zgłoś incydent bezpieczeństwa; zachowaj kopię katalogu."
  action.en: "Report a security incident; keep a copy of the catalog."
  source: "RD-51, D9.9 (budowa it. 99)"
  since: "0.1"

- code: KB-6503
  name: AuditAnchorMismatch
  class: security
  severity: critical
  message.pl: "Dziennik audytu nie zgadza się z kotwicą."
  message.en: "The audit log does not match an anchor."
  action: "Zgłoś incydent bezpieczeństwa; porównaj z kotwicą z raportu dziennego."
  action.en: "Report a security incident; compare with the anchor from the daily report."
  source: "D9.9 (budowa it. 99)"
  since: "0.1"

- code: KB-1406
  name: VssSnapshotFailed
  class: transient
  severity: error
  message.pl: "Nie udało się utworzyć migawki VSS — kopia bez migawki niemożliwa."
  message.en: "The VSS snapshot could not be created — backup without a snapshot is not possible."
  action: "Sprawdź usługę Kopiowanie woluminów w tle i dziennik zdarzeń; ponów kopię."
  action.en: "Check the Volume Shadow Copy service and the event log; retry the backup."
  source: "D2.8, D3.6, SP-01 (budowa it. 103)"
  since: "0.1"

- code: KB-7008
  name: WorkerStartBlocked
  class: permanent
  severity: error
  message.pl: "Start procesu pomocniczego Kobian.Worker został zablokowany przez politykę systemu."
  message.en: "Starting the Kobian.Worker helper process was blocked by a system policy."
  action: "Dodaj regułę wydawcy dla Kobian (WDAC/AppLocker/ASR) — dokumentacja administratora."
  action.en: "Add a publisher rule for Kobian (WDAC/AppLocker/ASR) - see the administrator documentation."
  source: "R2.2, PM-12, SP-16"
  since: "0.1"

- code: KB-7014
  name: WorkerProtocolViolation
  class: security
  severity: error
  message.pl: "Proces pomocniczy zwrócił niepoprawną odpowiedź — proces zakończony."
  message.en: "The helper process returned an invalid response — process terminated."
  action: "Zgłoś błąd; sprawdź integralność instalacji."
  action.en: "Report the bug; check the installation integrity."
  source: "D2.8 (budowa it. 103)"
  since: "0.1"

- code: KB-7015
  name: WorkerSignatureInvalid
  class: security
  severity: critical
  message.pl: "Plik procesu pomocniczego Kobian.Worker nie ma ważnego podpisu — uruchomienie wstrzymane."
  message.en: "The Kobian.Worker helper file has no valid signature — start refused."
  action: "Zainstaluj ponownie Kobian Backup z oficjalnego instalatora; zgłoś incydent."
  action.en: "Reinstall Kobian Backup from the official installer; report an incident."
  source: "SEC-2.7, D2.8 (budowa it. 106)"
  since: "0.1"

- code: KB-7016
  name: WorkerStartFailed
  class: permanent
  severity: error
  message.pl: "Nie udało się uruchomić procesu pomocniczego Kobian.Worker."
  message.en: "The Kobian.Worker helper process could not be started."
  action: "Sprawdź instalację (plik Kobian.Worker.exe obok usługi) i dziennik zdarzeń."
  action.en: "Check the installation (Kobian.Worker.exe next to the service) and the event log."
  source: "D2.8 (budowa it. 106)"
  since: "0.1"

- code: KB-1505
  name: IndexRecoveredFromPacks
  class: integrity
  severity: warning
  message.pl: "Indeks kopii był niedostępny — bloki odnalezione w indeksie odtworzonym z plików danych."
  message.en: "The backup index was unavailable — blocks were found in an index rebuilt from data files."
  action: "Uruchom kobian check --repair i sprawdź kopię; wykonaj nową kopię pełną."
  action.en: "Run kobian check --repair and check the backup; make a new full backup."
  source: "D3.10, D8.10 (budowa it. 110)"
  since: "0.1"

- code: KB-6201
  name: SmtpAuthRejected
  class: permanent
  severity: error
  message.pl: "Serwer SMTP odrzucił uwierzytelnienie (np. 550 5.7.30 — Basic Auth wyłączony)."
  message.en: "The SMTP server rejected authentication (e.g. 550 5.7.30 — Basic Auth disabled)."
  action: "Sprawdź login i hasło w pliku smtp.credentials; dla Microsoft 365 użyj OAuth2."
  action.en: "Check the login and password in the smtp.credentials file; for Microsoft 365 use OAuth2."
  source: "R2.9.6, 9.6 (BL-45)"
  since: "0.1"

- code: KB-6203
  name: EmailDeliveryFailed
  class: transient
  severity: warning
  message.pl: "Nie udało się doręczyć powiadomienia e-mail."
  message.en: "E-mail notification delivery failed."
  action: "Sprawdź serwer SMTP, adresy odbiorców i dziennik audytu."
  action.en: "Check the SMTP server, the recipient addresses and the audit log."
  source: "R2.9.6, D9.10 (BL-45)"
  since: "0.1"

- code: KB-6204
  name: SmtpConfigInvalid
  class: permanent
  severity: error
  message.pl: "Konfiguracja powiadomień e-mail jest niepoprawna."
  message.en: "The e-mail notification configuration is invalid."
  action: "Popraw zmienne KOBIAN_SMTP_* i plik smtp.credentials."
  action.en: "Fix the KOBIAN_SMTP_* variables and the smtp.credentials file."
  source: "9.6 (BL-45)"
  since: "0.1"

- code: KB-6205
  name: EmailAddressInvalid
  class: security
  severity: error
  message.pl: "Adres e-mail jest niepoprawny lub niebezpieczny."
  message.en: "The e-mail address is invalid or unsafe."
  action: "Podaj pojedynczy adres w postaci nazwa@domena, bez znaków sterujących."
  action.en: "Provide a single address in the form name@domain, without control characters."
  source: "SEC-9.1, CVE-2026-30227 (BL-45)"
  since: "0.1"

- code: KB-6206
  name: SmtpTlsFailed
  class: security
  severity: error
  message.pl: "Nie udało się nawiązać szyfrowanego połączenia z serwerem SMTP (TLS lub certyfikat)."
  message.en: "Could not establish an encrypted connection to the SMTP server (TLS or certificate)."
  action: "Sprawdź certyfikat serwera i obsługę STARTTLS/TLS."
  action.en: "Check the server certificate and STARTTLS/TLS support."
  source: "9.6, SEC-9.1 (BL-45)"
  since: "0.1"

- code: KB-6207
  name: SmtpInsecureEnabled
  class: security
  severity: warning
  message.pl: "Powiadomienia e-mail są wysyłane bez szyfrowania (jawne SMTP)."
  message.en: "E-mail notifications are sent without encryption (plain SMTP)."
  action: "Włącz STARTTLS lub TLS na serwerze i usuń KOBIAN_SMTP_INSECURE."
  action.en: "Enable STARTTLS or TLS on the server and remove KOBIAN_SMTP_INSECURE."
  source: "9.6 (BL-45)"
  since: "0.1"

- code: KB-2109
  name: TlsIdentityMismatch
  class: security
  severity: critical
  message.pl: "Certyfikat serwera FTPS jest niezaufany albo jego klucz (SPKI) nie zgadza się z przypiętym."
  message.en: "The FTPS server certificate is untrusted or its key (SPKI) does not match the pinned one."
  action: "Zweryfikuj odcisk SPKI serwera poza pasmem i zatwierdź go w konfiguracji celu albo użyj certyfikatu z zaufanego urzędu."
  action.en: "Verify the server SPKI fingerprint out of band and approve it in the destination settings, or use a certificate from a trusted authority."
  source: "D4.8, D4.11, BL-34"
  since: "0.1"

- code: KB-2110
  name: FtpsNotSupported
  class: permanent
  severity: error
  message.pl: "Serwer FTP nie obsługuje szyfrowania FTPS (odmowa AUTH TLS)."
  message.en: "The FTP server does not support FTPS encryption (AUTH TLS refused)."
  action: "Włącz FTPS (TLS) na serwerze albo użyj celu SFTP."
  action.en: "Enable FTPS (TLS) on the server or use an SFTP destination."
  source: "D4.3, D4.8, BL-34"
  since: "0.1"

- code: KB-2115
  name: InsecureTransportNotConfirmed
  class: security
  severity: error
  message.pl: "Cel FTP bez szyfrowania wymaga jawnego potwierdzenia — połączenie odrzucone."
  message.en: "An unencrypted FTP destination requires explicit confirmation — connection refused."
  action: "Użyj FTPS albo SFTP; jawny FTP tylko z flagą niezabezpieczonego połączenia (hasło leci otwartym tekstem)."
  action.en: "Use FTPS or SFTP; plain FTP only with the insecure-connection flag (the password is sent in clear text)."
  source: "D4.3, BL-34 (budowa)"
  since: "0.1"

- code: KB-2141
  name: ServerIdentityNotPending
  class: permanent
  severity: error
  message.pl: "Ten odcisk nie czeka na zatwierdzenie dla tego celu (zatwierdzić można tylko odcisk przedstawiony przez serwer i oczekujący)."
  message.en: "This fingerprint is not awaiting approval for this destination (only a fingerprint presented by the server and still pending can be approved)."
  action: "Sprawdź listę: kobian destinations identity list — i skopiuj dokładny odcisk ze stanu pending."
  action.en: "Check the list: kobian destinations identity list - and copy the exact fingerprint from the pending state."
  source: "D4.11, SEC-14.5, budowa it. 121"
  since: "0.1"

- code: KB-2142
  name: ServerIdentityApprovalExpired
  class: permanent
  severity: warning
  message.pl: "Oczekiwanie na zatwierdzenie tożsamości serwera wygasło (24 h)."
  message.en: "The server identity approval request has expired (24 h)."
  action: "Połącz się z celem ponownie (sprawdzenie celu albo uruchomienie zadania), zweryfikuj odcisk poza pasmem i zatwierdź go w ciągu 24 h."
  action.en: "Connect to the destination again (destination check or a job run), verify the fingerprint out of band and approve it within 24 h."
  source: "D4.11, budowa it. 121"
  since: "0.1"

- code: KB-2143
  name: ServerIdentityPinLimit
  class: permanent
  severity: error
  message.pl: "Cel ma już maksymalną liczbę zatwierdzonych kluczy serwera (4)."
  message.en: "The destination already has the maximum number of approved server keys (4)."
  action: "Zatwierdź nowy klucz z opcją zastąp (--replace) albo usuń zbędny cel."
  action.en: "Approve the new key with the replace option (--replace) or remove the unneeded destination."
  source: "D4.11, AC-12.2, budowa it. 121"
  since: "0.1"

- code: KB-0120
  name: ImportFormatInvalid
  class: permanent
  severity: error
  message.pl: "Plik importu zadań nie jest zgodny ze schematem kobian-export v1 — nic nie zaimportowano."
  message.en: "The job import file does not match the kobian-export v1 schema — nothing was imported."
  action: "Popraw plik wg listy błędów (ścieżka JSON + powód) albo wyeksportuj go ponownie."
  action.en: "Fix the file according to the error list (JSON path + reason) or export it again."
  source: "US-29, SEC-6.7, BL-47 (budowa)"
  since: "0.1"

- code: KB-0121
  name: ImportTooLarge
  class: permanent
  severity: error
  message.pl: "Plik importu zadań przekracza limit rozmiaru, głębokości lub liczby zadań."
  message.en: "The job import file exceeds the size, depth or job count limit."
  action: "Podziel eksport (kobian export --job ...) i importuj częściami."
  action.en: "Split the export (kobian export --job ...) and import it in parts."
  source: "US-29, SEC-6.7, BL-47 (budowa), SEC-3.3"
  since: "0.1"

- code: KB-0122
  name: ImportContainsSecret
  class: security
  severity: error
  message.pl: "Plik zadań zawiera wartość wyglądającą na sekret — odrzucono."
  message.en: "The job file contains a value that looks like a secret — rejected."
  action: "Usuń hasła i klucze z pliku; poświadczenia podaje się tylko jako secretRef (file:nazwa) w magazynie sekretów Agenta."
  action.en: "Remove passwords and keys from the file; credentials are given only as secretRef (file:name) in the Agent secret store."
  source: "US-29, SEC-6.7, BL-47 (budowa), AC-01.3"
  since: "0.1"

- code: KB-0123
  name: ImportActionsRejected
  class: security
  severity: error
  message.pl: "Plik zadań zawiera skrypty lub akcje (pre/post, runSql) — import ich nie przyjmuje."
  message.en: "The job file contains scripts or actions (pre/post, runSql) — import does not accept them."
  action: "Usuń akcje z pliku; skrypty konfiguruje Administrator w programie po imporcie."
  action.en: "Remove the actions from the file; scripts are configured by the administrator in the program after import."
  source: "US-29, SEC-6.7, BL-47 (budowa), AS-02"
  since: "0.1"

- code: KB-0124
  name: ImportNameConflict
  class: permanent
  severity: error
  message.pl: "Zadanie o tej nazwie już istnieje z inną definicją — nic nie zaimportowano."
  message.en: "A job with this name already exists with a different definition — nothing was imported."
  action: "Wybierz sposób rozwiązania konfliktu: pomiń, nadpisz albo zmień nazwę (--on-conflict skip|overwrite|rename)."
  action.en: "Choose how to resolve the conflict: skip, overwrite or rename (--on-conflict skip|overwrite|rename)."
  source: "US-29, SEC-6.7, BL-47 (budowa)"
  since: "0.1"

- code: KB-1604
  name: IndexConsolidationIncomplete
  class: transient
  severity: warning
  message.pl: "Konsolidacja indeksów nie została zakończona; repozytorium pozostaje czytelne i kompletne."
  message.en: "Index consolidation did not complete; the repository remains readable and complete."
  action: "Nic nie trzeba robić: kolejne porządkowanie ponowi konsolidację. Jeśli się powtarza, uruchom kobian check."
  action.en: "Nothing to do: the next pruning will repeat the consolidation. If it repeats, run kobian check."
  source: "D3.16, PM-17, BL-25 (budowa)"
  since: "0.1"

- code: KB-1510
  name: VerifyScheduledFailed
  class: integrity
  severity: critical
  message.pl: "Okresowa weryfikacja repozytorium (V3) wykryła uszkodzone lub brakujące dane kopii."
  message.en: "Periodic repository verification (V3) found damaged or missing backup data."
  action: "Uruchom kobian check --repair dla zadania; następna kopia zadania będzie pełna; sprawdź nośnik lub serwer docelowy i odtwarzaj z innej kopii (replika/USB)."
  action.en: "Run kobian check --repair for the job; the next backup of the job will be full; check the medium or the destination server and restore from another copy (replica/USB)."
  source: "3.7 V3, BL-26, D3.14, A04 (budowa: V3 z harmonogramu)"
  since: "0.1"

- code: KB-1511
  name: VerifySnapshotMissing
  class: integrity
  severity: critical
  message.pl: "Kopia zapisana w katalogu nie istnieje w repozytorium na celu (podłączono inny nośnik albo dane usunięto)."
  message.en: "A backup recorded in the catalog does not exist in the repository on the destination (a different medium is attached or data was deleted)."
  action: "Sprawdź, czy podłączono właściwy nośnik/udział; jeśli dane usunięto — wykonaj kopię pełną i odtwarzaj z innej kopii (replika/USB)."
  action.en: "Check that the right medium/share is attached; if the data was deleted, make a full backup and restore from another copy (replica/USB)."
  source: "3.7 V3, D3.14, A04 (budowa: V3 z harmonogramu)"
  since: "0.1"

- code: KB-6208
  name: OAuth2TokenRejected
  class: permanent
  severity: error
  message.pl: "Serwer tożsamości Microsoft odrzucił pobranie tokenu OAuth2 dla powiadomień e-mail."
  message.en: "The identity provider rejected the OAuth2 token request for e-mail notifications."
  action: "Sprawdź identyfikator dzierżawy, identyfikator aplikacji i sekret w smtp.oauth oraz uprawnienia SMTP.SendAsApp aplikacji."
  action.en: "Check the tenant id, application id and the secret in smtp.oauth, and the application's SMTP.SendAsApp permission."
  source: "BL-45, 9.6 (budowa it. 129)"
  since: "0.1"

- code: KB-6209
  name: OAuth2ConfigInvalid
  class: permanent
  severity: error
  message.pl: "Konfiguracja uwierzytelnienia OAuth2 dla e-mail jest niepoprawna."
  message.en: "The OAuth2 authentication configuration for e-mail is invalid."
  action: "Popraw zmienne KOBIAN_SMTP_OAUTH_* i plik smtp.oauth."
  action.en: "Fix the KOBIAN_SMTP_OAUTH_* variables and the smtp.oauth file."
  source: "BL-45, 9.6 (budowa it. 129)"
  since: "0.1"
