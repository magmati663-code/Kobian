# Rejestr kodów błędów Kobian Backup (D1.8). Jedno źródło prawdy: KbCode (src/Kobian.Domain/KbCode.cs)
# musi zawierać dokładnie te kody (test Kobian.Tests.Unit.KbRegistryTests). Generator enum/.resx — BL-4.
# Pola: code, name (stała C#), class (transient|permanent|integrity|security), severity (info|warning|error|critical),
# message.pl, message.en, action, source (ID planu), since. Komunikaty bez sekretów i danych klienta (SEC-11.5).
# Kody oznaczone source „budowa it. N” są nowe (nie występują w planie) — do akceptacji PO.

